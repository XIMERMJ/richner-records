<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CORRESPONDED — XIMERMJ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {

    }

      width: min(720px, 88vw);
    }

    .track {
      font-size: 18px;
      letter-spacing: 3px;
      font-weight: 400;
      margin-bottom: 5px;
    }

    .artist {
      font-size: 10px;

      color: #777;

    }

    .controls {
      display: flex;
      align-items: center;

    }

    button {
      width: 42px;
      height: 42px;
      border: 1px solid #fff;
      border-radius: 50%;
      background: transparent;
      color: #fff;
      cursor: pointer;
      font-size: 11px;
      padding: 0 0 0 2px;
      flex-shrink: 0;
      transition: .2s ease;
    }

    button:hover {
      background: #fff;
      color: #000;
    }

    .line {
      flex: 1;
      height: 1px;
      background: #292929;
      position: relative;
    }

    .progress {
      position: absolute;
      left: 0;
      top: 0;
      height: 1px;
      width: 0%;

      font-size: 9px;
      letter-spacing: 1px;
      color: #777;
      min-width: 34px;
      text-align: right;
    }

    .bottom {
      display: flex;
      justify-content: space-between;
      margin-top: 18px;
      font-size: 8px;
      letter-spacing: 2px;
      color: #333;
    }

    iframe {
      display: none;
    }
  </style>
</head>

<body>

  <main class="player">

    <div class="track">CORRESPONDED</div>
    <div class="artist">XIMERMJ</div>

    <div class="controls">

      <button id="play" aria-label="Play">
        ▶
      </button>

      <div class="line">
        <div class="progress" id="progress"></div>
      </div>

      <div class="time" id="time">
        00:00
      </div>

    </div>

    <div class="bottom">
      <span>SOUNDCLOUD</span>
      <span>2430347670</span>
    </div>

    <iframe
      id="soundcloud"
      src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A2430347670&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false">
    </iframe>

  </main>

  <script src="https://w.soundcloud.com/player/api.js"></script>

  <script>
    const iframe = document.getElementById("soundcloud");
    const widget = SC.Widget(iframe);

    const button = document.getElementById("play");
    const progress = document.getElementById("progress");
    const time = document.getElementById("time");

    button.addEventListener("click", function () {

      widget.isPaused(function (paused) {

        if (paused) {
          widget.play();
        } else {
          widget.pause();
        }

      });

    });

    widget.bind(SC.Widget.Events.PLAY, function () {
      button.textContent = "Ⅱ";
    });

    widget.bind(SC.Widget.Events.PAUSE, function () {
      button.textContent = "▶";
    });

    widget.bind(SC.Widget.Events.FINISH, function () {
      button.textContent = "▶";
      progress.style.width = "0%";
      time.textContent = "00:00";
    });

    widget.bind(SC.Widget.Events.PLAY_PROGRESS, function (event) {

      progress.style.width =
        (event.relativePosition * 100) + "%";

      const seconds =
        Math.floor(event.currentPosition / 1000);

      const minutes =
        Math.floor(seconds / 60);

      const remaining =
        seconds % 60;

      time.textContent =
        String(minutes).padStart(2, "0") +
        ":" +
        String(remaining).padStart(2, "0");

    });
  </script>

</body>
</html>
